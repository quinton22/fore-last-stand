name: build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        options: [apk, appbundle, ios]
        default: apk
  # A merged PR lands on main as a push, so this builds only on merges that touch the project.
  push:
    branches: [main]

jobs:
  build-android:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name fore_last_stand --org com.qbitcore .
      # Cache Gradle deps and the wrapper distribution so builds don't re-download from Maven Central (avoids 429s).
      # android/ is generated above, so the key hashes the generated Gradle files (which pin the Gradle/AGP versions).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Build
        run: flutter build ${{ inputs.target == 'appbundle' && 'appbundle' || 'apk' }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: fore-last-stand-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  build-ios:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --project-name fore_last_stand --org com.qbitcore .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: fore-last-stand-ios
          path: build/ios/iphoneos/Runner.app
